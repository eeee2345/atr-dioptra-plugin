[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atr-dioptra-plugin"
version = "0.1.0"
description = "ATR (Agent Threat Rules) scanner plugin for NIST Dioptra — scans agent skill / MCP manifests and emits a rule-hits table as Dioptra artifacts + metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ATR" }]
keywords = ["dioptra", "atr", "agent-security", "mcp", "nist"]

# pyatr powers the actual scan. It requires Python >=3.10.
dependencies = [
  "pyatr>=0.2.6",
]

[project.optional-dependencies]
s3 = ["boto3>=1.28"]
dev = [
  "pytest>=7.4",
  "tomli>=2.0; python_version < '3.11'",
  "pyyaml>=6.0",
]

[project.scripts]
atr-dioptra-scan = "atr_scanner.cli:main"

[tool.setuptools]
package-dir = { "" = "plugins" }

[tool.setuptools.packages.find]
where = ["plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that require the real pyatr engine to be installed",
]
