# Dioptra task-graph entrypoint for the ATR manifest scan.
#
# Wiring follows the usnistgov/dioptra "extra/entrypoints" examples: graph
# steps call plugin tasks, `$step` (or `$step.output`) feeds downstream inputs,
# and the `artifacts` block turns a step output into a Dioptra artifact via an
# artifact task. Entrypoint parameters are declared in dioptra.toml; Dioptra's
# resource import reads only the `graph` and `artifacts` keys of this file.
#
# Flow:
#   resolve_step   : resolve local path / S3 URI  -> local_root
#   scan_step      : run ATR engine over manifests -> hits (atr_hits_table)
#   summarize_step : reduce hits to counts          -> metrics (atr_metrics)
#   metrics_step   : record the counts as Dioptra job metrics
#   artifacts      : store the hits table as atr_hits.json and atr_hits.csv

graph:
  resolve_step:
    resolve_input:
      manifest_location: $manifest_location
      s3_download_dir: $s3_download_dir

  scan_step:
    scan_manifests:
      local_root: $resolve_step
      rules_dir: $rules_dir

  summarize_step:
    summarize_hits:
      hits: $scan_step
      local_root: $resolve_step

  metrics_step:
    log_scan_metrics:
      metrics: $summarize_step

artifacts:
  atr_hits:
    contents: $scan_step
    task:
      name: AtrHitsTableArtifactTask
      args:
        format: json
  atr_hits_csv:
    contents: $scan_step
    task:
      name: AtrHitsTableArtifactTask
      args:
        format: csv
