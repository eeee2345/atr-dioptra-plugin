name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,e2e]"
      - run: pytest -q

  # Same suite with the pinned Dioptra release installed: adds the checks in
  # tests/test_dioptra_compat.py (import schema, pyplugs registration,
  # artifact interface) that skip without Dioptra.
  dioptra-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,e2e]" "dioptra-platform==1.2.1" jsonschema
      # Includes tests/test_dioptra_engine.py: the entrypoint run through
      # Dioptra's own validation, artifact discovery and run_experiment.
      - run: pytest -q -rs

  # Builds the custom worker on the official Dioptra worker image; the
  # Dockerfile scans the bundled samples at build time, so a broken runtime
  # fails here.
  worker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t atr-dioptra-worker:ci .
